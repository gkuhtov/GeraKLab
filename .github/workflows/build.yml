name: Сборка GeraKLab IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка XcodeGen
        run: |
          brew install xcodegen

      - name: Генерация .xcodeproj
        run: |
          xcodegen generate

      - name: Сборка приложения через xcodebuild
        run: |
          xcodebuild build \
            -project GeraKLab.xcodeproj \
            -scheme GeraKLab \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Упаковка в IPA (для TrollStore / ESign)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/GeraKLab.app Payload/
          zip -r GeraKLab.ipa Payload
          rm -rf Payload

      - name: Выгрузка готового IPA в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: GeraKLab-IPA
          path: GeraKLab.ipa
          retention-days: 14
