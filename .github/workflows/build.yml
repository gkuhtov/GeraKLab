name: Build GeraKLab IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show project files
        run: |
          echo "=== PROJECT.YML ==="
          cat project.yml

          echo
          echo "=== CONFIG FILES ==="
          find Resources/Config -maxdepth 1 -type f -name "*.json" -print

      - name: Generate Xcode project
        run: |
          xcodegen generate

          echo
          echo "=== GENERATED PROJECT RESOURCES ==="
          grep -n "appearance.json\|experiments.json\|home.json\|results.json\|texts.json\|achievements.json" \
            GeraKLab.xcodeproj/project.pbxproj || true

      - name: Inspect generated app configuration
        run: |
          echo "=== GENERATED PROJECT CONFIGURATION ==="
          grep -nE "INFOPLIST_FILE|GENERATE_INFOPLIST_FILE|UILaunchScreen|UISupportedInterfaceOrientations|UIRequiresFullScreen|TARGETED_DEVICE_FAMILY"             GeraKLab.xcodeproj/project.pbxproj || true

          echo
          echo "=== XCODE BUILD SETTINGS ==="
          xcodebuild             -project GeraKLab.xcodeproj             -scheme GeraKLab             -showBuildSettings             | grep -E "INFOPLIST_FILE|GENERATE_INFOPLIST_FILE|PRODUCT_BUNDLE_IDENTIFIER|TARGETED_DEVICE_FAMILY|SUPPORTED_PLATFORMS|SDKROOT"

          echo
          echo "=== SOURCE INFO.PLIST ==="
          cat App/Info.plist

      - name: Build archive
        run: |
          xcodebuild \
            -project GeraKLab.xcodeproj \
            -scheme GeraKLab \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/GeraKLab.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Inspect final Info.plist
        run: |
          APP="build/GeraKLab.xcarchive/Products/Applications/GeraKLab.app"

          echo "=== FINAL APP INFO.PLIST ==="
          /usr/libexec/PlistBuddy -c "Print" "$APP/Info.plist"

          echo
          echo "=== SCREEN / WINDOW KEYS ==="
          echo "--- UILaunchScreen ---"
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$APP/Info.plist" || true

          echo "--- UISupportedInterfaceOrientations ---"
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$APP/Info.plist" || true

          echo "--- UIRequiresFullScreen ---"
          /usr/libexec/PlistBuddy -c "Print :UIRequiresFullScreen" "$APP/Info.plist" || true

          echo "--- UIDeviceFamily ---"
          /usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$APP/Info.plist" || true

          echo
          echo "=== APP BINARY ==="
          file "$APP/GeraKLab"

      - name: Inspect built app
        run: |
          APP="build/GeraKLab.xcarchive/Products/Applications/GeraKLab.app"

          echo "=== APP CONTENTS ==="
          find "$APP" -maxdepth 3 -type f -print | sort

          echo
          echo "=== JSON IN APP ==="
          find "$APP" -type f -name "*.json" -print

          echo
          echo "=== CONFIG DIRECTORIES ==="
          find "$APP" -type d -name "Config" -print

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -R build/GeraKLab.xcarchive/Products/Applications/GeraKLab.app build/Payload/

          cd build
          zip -r GeraKLab.ipa Payload

      - name: Inspect IPA
        run: |
          echo "=== JSON IN IPA ==="
          unzip -l build/GeraKLab.ipa | grep -E '\.json$' || true

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: GeraKLab-IPA
          path: build/GeraKLab.ipa
