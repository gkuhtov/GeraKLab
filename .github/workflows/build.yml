name: Build GeraKLab IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show project files
        run: |
          echo "=== PROJECT.YML ==="
          cat project.yml

          echo
          echo "=== CONFIG FILES ==="
          find Resources/Config -maxdepth 1 -type f -name "*.json" -print

      - name: Generate Xcode project
        run: |
          xcodegen generate

          echo
          echo "=== GENERATED PROJECT RESOURCES ==="
          grep -n "appearance.json\|experiments.json\|home.json\|results.json\|texts.json\|achievements.json" \
            GeraKLab.xcodeproj/project.pbxproj || true

      - name: Build archive
        run: |
          xcodebuild \
            -project GeraKLab.xcodeproj \
            -scheme GeraKLab \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/GeraKLab.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Inspect built app
        run: |
          APP="build/GeraKLab.xcarchive/Products/Applications/GeraKLab.app"

          echo "=== APP CONTENTS ==="
          find "$APP" -maxdepth 3 -type f -print | sort

          echo
          echo "=== JSON IN APP ==="
          find "$APP" -type f -name "*.json" -print

          echo
          echo "=== CONFIG DIRECTORIES ==="
          find "$APP" -type d -name "Config" -print

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -R build/GeraKLab.xcarchive/Products/Applications/GeraKLab.app build/Payload/

          cd build
          zip -r GeraKLab.ipa Payload

      - name: Inspect IPA
        run: |
          echo "=== JSON IN IPA ==="
          unzip -l build/GeraKLab.ipa | grep -E '\.json$' || true

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: GeraKLab-IPA
          path: build/GeraKLab.ipa
