name: GeraKLab

options:
  bundleIdPrefix: com.gkuhtov
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  GeraKLab:
    type: application
    platform: iOS

    sources:
      - path: App
      - path: Core
      - path: Models
      - path: Screens

    resources:
      - path: Resources/Config/appearance.json
      - path: Resources/Config/experiments.json
      - path: Resources/Config/home.json
      - path: Resources/Config/results.json
      - path: Resources/Config/texts.json
      - path: Resources/Config/achievements.json

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gkuhtov.geraklab
        PRODUCT_NAME: GeraKLab

    info:
      path: App/Info.plist
